<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"word","type":"string","label":"Word inside the bubble (empty = typing dots)","default":""}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Bubble transition</title>
    <script src="gsap.min.js"></script>
    <style>
      /*MOS:TOKENS*/
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .stage { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 470px; }
      .bubble-wrap { position: relative; width: 420px; height: 340px; }
      svg { position: absolute; inset: 0; width: 420px; height: 340px; overflow: visible; }
      .fill { position: absolute; left: 50%; top: 68%; width: 400px; height: 400px; margin: -200px 0 0 -200px; border-radius: 50%; background: var(--g-night); opacity: 0; }
      .dots { position: absolute; left: 0; right: 0; top: 118px; display: flex; justify-content: center; gap: 26px; }
      .dot { width: 34px; height: 34px; border-radius: 50%; background: var(--c-text); opacity: 0; }
      .word { position: absolute; left: 0; right: 0; top: 112px; text-align: center; font-family: var(--font-sans); font-weight: 700; font-size: 64px; letter-spacing: -1.5px; color: var(--c-text); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="bubble-transition" data-start="0" data-width="1080" data-height="1920" data-duration="1.8">
      <div id="stage" class="stage clip" data-start="0" data-duration="1.8" data-track-index="0">
        <div id="fill" class="fill"></div>
        <div id="wrap" class="bubble-wrap">
          <svg viewBox="0 0 420 340" aria-hidden="true">
            <defs>
              <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" style="stop-color: var(--c-accent)" />
                <stop offset="100%" style="stop-color: var(--c-status-info)" />
              </linearGradient>
            </defs>
            <path id="outline" d="M110 20 H310 A100 100 0 0 1 410 120 V170 A100 100 0 0 1 310 270 H150 L70 330 L92 262 A100 100 0 0 1 10 170 V120 A100 100 0 0 1 110 20 Z" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linejoin="round" />
          </svg>
          <div class="dots"><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>
          <div id="word" class="word" data-var-text="word"></div>
        </div>
      </div>
    </div>
    <script>
      const vars = window.__hyperframes ? window.__hyperframes.getVariables() : {};
      const hasWord = Boolean((vars.word || "").trim());
      const outline = document.getElementById("outline");
      const len = outline.getTotalLength();
      outline.style.strokeDasharray = String(len);

      const tl = gsap.timeline({ paused: true });
      // A message bubble draws itself in the brand accent gradient.
      tl.fromTo("#outline", { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.5, ease: "power3.inOut" }, 0);
      tl.fromTo("#wrap", { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
      if (hasWord) {
        tl.fromTo("#word", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 0.38);
      } else {
        // Typing dots: one soft pass, no endless loop.
        ["#d1", "#d2", "#d3"].forEach((d, i) => {
          tl.fromTo(d, { opacity: 0.25, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.36 + i * 0.09);
        });
      }
      // The bubble becomes the background surface that covers the cut…
      tl.fromTo("#fill", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 7.5, duration: 0.5, ease: "power3.in" }, 0.72);
      tl.to("#wrap", { scale: 3.2, opacity: 0, duration: 0.42, ease: "power3.in" }, 0.76);
      // …and dissolves to reveal the next scene.
      tl.to("#fill", { opacity: 0, duration: 0.5, ease: "sine.inOut" }, 1.28);
      window.__timelines["bubble-transition"] = tl;
    </script>
  </body>
</html>
